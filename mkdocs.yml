site_name: CUDA
site_description: Learning CUDA properly, from fundamentals to real-world GPU systems.
repo_url: https://github.com/moezdil/CUDA
site_url: https://moezdil.github.io/CUDA/
docs_dir: docs
site_dir: public

theme:
  name: null
  custom_dir: theme

plugins: []

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - md_in_html
  - pymdownx.details

nav:
  - Home: index.md
  - GPU Fundamentals:
      - "00 Starting CUDA": GPU/Lesson-00/notes.md
      - "01 Where GPUs Come From": GPU/Lesson-01/notes.md
      - "02 Architecture, Generation and Chips": GPU/Lesson-02/notes.md
      - "03 Reading GPU Specs": GPU/Lesson-03/notes.md
      - "04 NVIDIA GPU Architectures": GPU/Lesson-04/notes.md
      - "05 Compute Capability": GPU/Lesson-05/notes.md
      - "06 Memory Bandwidth": GPU/Lesson-06/notes.md
      - "07 The Memory Hierarchy": GPU/Lesson-07/notes.md
      - "08 Warps and Latency Hiding": GPU/Lesson-08/notes.md
      - "09 Compute or Memory Bound": GPU/Lesson-09/notes.md
      - "10 Number Formats and Tensor Cores": GPU/Lesson-10/notes.md
      - "11 CPU to GPU Data Path": GPU/Lesson-11/notes.md
      - "12 Many GPUs Together": GPU/Lesson-12/notes.md
      - "13 Reading White Papers": GPU/Lesson-13/notes.md
      - "14 CUDA Toolkit": GPU/Lesson-14/notes.md
      - "15 Dev Setup with JetBrains": GPU/Lesson-15/notes.md
      - "16 Linux on Windows (WSL)": GPU/Lesson-16/notes.md
      - "17 Installing CUDA on Linux": GPU/Lesson-17/notes.md
  - CUDA Practice:
      - "00 One Block, One Thread": cuda/Lesson-00/notes.md
      - "01 One Block, Four Threads": cuda/Lesson-01/notes.md
      - "02 Two Blocks, 1024 Threads": cuda/Lesson-02/notes.md
      - "03 Compute Capability": cuda/Lesson-03/notes.md
      - "04 Built-in Variables": cuda/Lesson-04/notes.md
      - "05 The CUDA Platform Stack": cuda/Lesson-05/notes.md
      - "06 Compiling CUDA on Linux": cuda/Lesson-06/notes.md
      - "07 Warp IDs": cuda/Lesson-07/notes.md
      - "08 Vector Addition": cuda/Lesson-08/notes.md
      - "09 Many Blocks and Timing": cuda/Lesson-09/notes.md

exclude_docs: |
  *.tr.md
  *.zh.md
