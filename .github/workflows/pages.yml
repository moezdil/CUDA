name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "mkdocs<2" pymdown-extensions pygments
      - run: mkdir docs && cp -r GPU cuda manning.png manning.jpeg docs/ && cp README.md docs/index.md
      - run: mkdocs build --strict
      - name: Build translations
        run: |
          for l in zh tr; do
            mkdir docs-$l && cp -r GPU cuda manning.png manning.jpeg docs-$l/ && cp README.md docs-$l/index.md
            find docs-$l -name "notes.$l.md" -exec sh -c 'mv "$1" "${1%.*.md}.md"' _ {} \;
            mkdocs build --strict -f mkdocs.$l.yml
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
